# Profile de produção — ativar com SPRING_PROFILES_ACTIVE=prod

# PostgreSQL (Render Postgres, Supabase, etc.)
# Modo 1 (recomendado para Render): defina DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
# Modo 2: defina DATABASE_URL completa no formato jdbc:postgresql://host:5432/dbname
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:merenda}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mantemos ddl-auto=update por compatibilidade com bancos legados.
# Roadmap: migrar para "validate" quando o schema for 100% gerenciado por Flyway (V2+).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway — habilitado em prod com baseline para não tentar criar schema existente.
# Bancos em produção (pré-Flyway) serão marcados como já estando em V1; futuras
# mudanças de schema devem ser V2__..., V3__..., V4__... em src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Desabilita H2 console em prod
spring.h2.console.enabled=false

# Logging mais enxuto
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

server.port=${PORT:10000}
