# Profile de produção — ativar com SPRING_PROFILES_ACTIVE=prod

# PostgreSQL (Render Postgres, Supabase, etc.)
# Modo 1 (recomendado para Render): defina DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
# Modo 2: defina DATABASE_URL completa no formato jdbc:postgresql://host:5432/dbname
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:merenda}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Em produção, prefira validate/none + migrations (Flyway). update funciona como bootstrap rápido.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desabilita H2 console em prod
spring.h2.console.enabled=false

# Logging mais enxuto
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
