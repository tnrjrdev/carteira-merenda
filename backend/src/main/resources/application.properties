spring.application.name=merenda-backend
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/merendadb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (acesso em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
merenda.security.jwt.secret=ZGVzZW52b2x2aW1lbnRvLW1lcmVuZGEtc2VjcmV0LXN1cGVyLWNoYXZlLXN1cGVyLWxvbmdhLXBhcmEtaG1hYy1zaGEyNTYtMjAyNg==
merenda.security.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=INFO
