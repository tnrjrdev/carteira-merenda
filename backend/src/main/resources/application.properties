spring.application.name=merenda-backend
server.port=${PORT:8080}

# H2 Database (dev default — sobrescrito pelo profile prod)
spring.datasource.url=jdbc:h2:file:./data/merendadb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (apenas em dev — desabilitado em prod via profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway — desligado em dev (H2 + ddl-auto=update já gerencia o schema).
# Em prod (application-prod.properties) Flyway fica ativo com baseline.
spring.flyway.enabled=false

# JWT (em prod, sobrescreva via JWT_SECRET — gere com: openssl rand -base64 64)
merenda.security.jwt.secret=${JWT_SECRET:ZGVzZW52b2x2aW1lbnRvLW1lcmVuZGEtc2VjcmV0LXN1cGVyLWNoYXZlLXN1cGVyLWxvbmdhLXBhcmEtaG1hYy1zaGEyNTYtMjAyNg==}
merenda.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — origens separadas por vírgula
merenda.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Pagamento (Pix / Cartão / Boleto)
# gateway: "simulated" (default, sem cobrança real) ou "mercadopago"
# Quando "mercadopago" + access-token presente: Pix, Cartão (Bricks) e Boleto reais.
merenda.pagamento.gateway=${PAGAMENTO_GATEWAY:simulated}
merenda.pagamento.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
merenda.pagamento.mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
merenda.pagamento.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# Cartao de credito — taxa de conveniencia repassada ao pagador (default 4,99% — usada no SimulatedCartaoGateway).
# Em produção com Mercado Pago, a taxa é calculada pelo próprio gateway (fee_details na resposta).
merenda.pagamento.cartao.taxa-conveniencia=${CARTAO_TAXA_CONVENIENCIA:0.0499}

# Push notifications (FCM via Firebase Admin SDK)
# Quando enabled=true E credenciais presentes → envio real
# Quando enabled=false ou sem credenciais → modo MOCK (apenas log + SSE in-app)
merenda.push.enabled=${PUSH_ENABLED:false}
merenda.push.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
merenda.push.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# LGPD — versao da politica de privacidade vigente
merenda.lgpd.politica-versao=${LGPD_POLITICA_VERSAO:2026-01-01}

# Google Login (OAuth 2.0)
google.client.id=${GOOGLE_CLIENT_ID:264108230123-qjtlf3no2s6qrjfm8nci4eap4kvphfg4.apps.googleusercontent.com}

# Logging
logging.level.org.springframework.security=INFO
